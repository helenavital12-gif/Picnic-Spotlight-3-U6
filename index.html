function shuffle(items) {
  const copy = [...items];
  for (let last = copy.length-1; last > 0; last--) {
    const pick = Math.floor(Math.random() * (last+1));
    [copy[last], copy[pick]] = [copy[pick], copy[last]];
  }
  return copy;
}
function newPicnic() {

function round(){const [clue,q,hint,order]=rounds[step];game.innerHTML='<div class="row"><span class="tag">'+(step<3?'Загадка Пипа':'Семейный пикник')+' · '+(step+1)+'/6</span><div class="basket">'+rounds.map((_,i)=>'<i class="'+(i<step?'full':'')+'"></i>').join('')+'</div></div><p>'+clue+'</p><h2 tabindex="-1">'+q+'</h2><div class="choices">'+order.map(i=>'<button onclick="choose('+i+',this)"><span aria-hidden="true">'+food[i][0]+'</span>'+food[i][1]+'</button>').join('')+'</div><button id="hintBtn" onclick="showHint()">💡 Подсказка</button><div aria-live="polite" id="feedback"></div><button hidden class="primary" id="next" onclick="advance()"></button>';game.querySelector('h2').focus()}
function showHint(){document.querySelector('#feedback').innerHTML='<p>'+rounds[step][2]+'</p>'}
function choose(i,btn){const r=rounds[step],f=document.querySelector('#feedback');if(r[4]!==null && r[4]!==i){btn.disabled=true;btn.classList.add('miss');f.innerHTML='<p>Попробуй ещё! '+r[2]+'</p>';return}picks[step]=i;game.querySelectorAll('.choices button').forEach(b=>b.disabled=true);btn.classList.add('good');document.querySelector('#hintBtn').hidden=true;f.innerHTML='<div class="strip">'+r[5]+'<strong class="phrase">'+(step<3?r[6]:r[6]+food[i][1]+'.')+'</strong></div>';const n=document.querySelector('#next');n.hidden=false;n.textContent=step===5?'Готово! На полянку →':'Я сказал(а)! Дальше →';n.focus()}
function advance(){step++;if(step<6){round();return}game.innerHTML='<div class="tag">Пикник готов!</div><h2 tabindex="-1">Thank you!</h2><div class="emoji">🧺 '+picks.slice(0,3).map(i=>food[i][0]).join(' ')+'</div><p>Пип разложил угощения на полянке. А теперь расскажи ему про семейный пикник по памяти. Подглядывай, если нужно!</p><div class="strip">'+['I like ','My mother likes ','My father likes '].map((s,j)=>'<div>'+food[picks[j+3]][0]+' '+s+'<b>'+food[picks[j+3]][1]+'</b>.</div>').join('')+'</div><button class="primary" onclick="start()">Сыграть ещё раз ↻</button>';game.querySelector('h2').focus()}
start();
